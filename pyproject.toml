[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "labaegis"
version = "0.1.0"
description = "Open-Source Clinical Ontology & Containment Engine for Laboratory Medicine (LOINC/UCUM/FHIR + L1-L5 + EFLM RCV + Glass-Box XAI)"
readme = "README.md"
license = {text = "Apache-2.0"}
authors = [{name = "Mateusz Jakubowski"}]
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0",
    "numpy>=1.24",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "xgboost>=2.0",
    "shap>=0.45",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]
